<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FlowHarbor - __ENV_LABEL__</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; background: #1a1a2e; color: #e0e0e0; }
    .card { width: 480px; padding: 2.5rem; border-radius: 16px; background: linear-gradient(135deg, #16213e 0%, #0f3460 100%); box-shadow: 0 8px 32px rgba(0,0,0,0.4); }
    .badge { display: inline-block; padding: 4px 14px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 1rem; }
    .badge-dev { background: #f72585; color: #fff; }
    .badge-staging { background: #ff9e00; color: #1a1a2e; }
    .badge-prod { background: #06d6a0; color: #1a1a2e; }
    h1 { color: #4cc9f0; font-size: 2rem; margin-bottom: 0.25rem; }
    .subtitle { color: #9e9e9e; font-size: 0.85rem; margin-bottom: 1.5rem; }
    .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 1.5rem 0; }
    .info-item { background: rgba(255,255,255,0.05); padding: 12px; border-radius: 8px; }
    .info-label { font-size: 0.65rem; text-transform: uppercase; color: #9e9e9e; letter-spacing: 1px; margin-bottom: 4px; }
    .info-value { font-size: 0.9rem; color: #e0e0e0; font-weight: 500; word-break: break-all; }
    .info-value a { color: #4cc9f0; text-decoration: none; }
    .info-value a:hover { text-decoration: underline; }
    .link-row { margin-top: 1.5rem; padding-top: 1rem; border-top: 1px solid rgba(255,255,255,0.1); text-align: center; }
    .link-row a { color: #4cc9f0; font-size: 0.85rem; text-decoration: none; }
    .link-row a:hover { text-decoration: underline; }
    .env-dev { color: #f72585; }
    .env-staging { color: #ff9e00; }
    .env-prod { color: #06d6a0; }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge badge-__ENV__">__ENV_LABEL__</div>
    <h1>FlowHarbor</h1>
    <div class="subtitle">CI/CD Pipeline Demo</div>

    <div class="info-grid">
      <div class="info-item">
        <div class="info-label">Environment</div>
        <div class="info-value env-__ENV__">__ENV_LABEL__</div>
      </div>
      <div class="info-item">
        <div class="info-label">Version</div>
        <div class="info-value">v__VERSION__</div>
      </div>
      <div class="info-item">
        <div class="info-label">Build Number</div>
        <div class="info-value">#__BUILD_NUMBER__</div>
      </div>
      <div class="info-item">
        <div class="info-label">Deployed At</div>
        <div class="info-value">__TIMESTAMP__</div>
      </div>
      <div class="info-item">
        <div class="info-label">Git Branch</div>
        <div class="info-value">__GIT_BRANCH__</div>
      </div>
      <div class="info-item">
        <div class="info-label">Git Commit</div>
        <div class="info-value">__GIT_COMMIT__</div>
      </div>
      <div class="info-item" style="grid-column: span 2;">
        <div class="info-label">Author</div>
        <div class="info-value">__GIT_AUTHOR__</div>
      </div>
    </div>

    <div class="link-row">
      <a href="__PIPELINE_URL__" target="_blank">View Pipeline ▶</a>
    </div>
  </div>
</body>
</html>
